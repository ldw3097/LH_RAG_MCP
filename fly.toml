app = 'lh-rag-mcp'
primary_region = 'nrt'  # Tokyo — 한국에서 가장 가까운 fly.io 리전

[build]
  dockerfile = 'Dockerfile'

[env]
  BM25_PATH       = '/data/lh_regulation'
  MARKDOWN_PATH   = '/data/lh_regulation/markdown'
  KCSC_DATA_PATH  = '/data/kcsc'
  PPS_DATA_PATH   = '/data/pps'
  CSI_DATA_PATH   = '/data/csi'
  PORT            = '8000'
  HOST            = '0.0.0.0'

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = 'suspend'  # 메모리 보존 일시정지 (stop보다 재개 빠름)
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = '2gb'
  cpu_kind = 'shared'
  cpus     = 2

[[mounts]]
  source      = 'lh_data'
  destination = '/data'
  initial_size = '10gb'
