[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-rag-mcp"
version = "0.1.0"
description = "LH 임직원용 법령·규정 RAG MCP 서버"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "docling>=2.0.0",       # PDF 변환: 표 구조 + 자동 OCR (pdfium 백엔드로 한국어 공백 복원)
    "python-dotenv>=1.0.0",
    "kiwipiepy>=0.19.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
lh-rag-mcp = "src.server:main"
lh-build-index = "scripts.build_index:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts", "crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
